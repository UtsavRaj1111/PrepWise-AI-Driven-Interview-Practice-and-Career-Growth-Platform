<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | PrepWise Details</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/prepwise_logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .details-main {
            min-height: calc(100vh - 5rem);
            padding: 8rem 1.5rem 5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .details-container {
            max-width: 900px;
            width: 100%;
            background: linear-gradient(135deg, rgba(15, 20, 25, 0.7), rgba(10, 12, 18, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 4rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .details-container::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--feature-accent-15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 2.5rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-btn:hover {
            color: var(--feature-accent);
            transform: translateX(-5px);
        }

        .detail-icon {
            width: 80px;
            height: 80px;
            background: var(--feature-accent-10);
            border: 1px solid var(--feature-accent-25);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--feature-accent);
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px var(--feature-accent-15);
        }

        .detail-title {
            font-size: 3rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 1.5rem;
        }

        .detail-content {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.15rem;
            line-height: 1.8;
            margin-bottom: 3rem;
        }

        .detail-features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 3rem;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .feature-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--feature-accent-30);
            transform: translateY(-5px);
        }

        .feature-item i {
            color: var(--feature-accent);
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        .feature-item h5 {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .feature-item p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.5);
        }

        .cta-btn {
            display: inline-block;
            background: var(--feature-accent);
            color: var(--cta-text-color);
            padding: 1.2rem 3rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.1rem;
            margin-top: 4rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px var(--feature-accent-40);
            text-align: center;
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px var(--feature-accent-60);
            filter: brightness(1.1);
        }

        @media (max-width: 768px) {
            .details-container { padding: 2.5rem; }
            .detail-title { font-size: 2.2rem; }
        }
    </style>
</head>

<body>
    {% include 'base/header.html' %}

    <main class="details-main" style="
        --feature-accent: {{ accent_color }};
        --feature-accent-10: {{ accent_color ~ '10' }};
        --feature-accent-15: {{ accent_color ~ '15' }};
        --feature-accent-25: {{ accent_color ~ '25' }};
        --feature-accent-30: {{ accent_color ~ '30' }};
        --feature-accent-40: {{ accent_color ~ '40' }};
        --feature-accent-60: {{ accent_color ~ '60' }};
        --cta-text-color: {{ '#05070a' if (accent_color|lower) == '#00d4ff' else '#fff' }};
    ">
        <div class="details-container animate-up">
            <a href="/#about" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>

            <div class="detail-icon">
                <i class="{{ icon }}"></i>
            </div>

            <h1 class="detail-title">{{ title }}</h1>
            
            <div class="detail-content">
                {{ description | safe }}
            </div>

            <div class="detail-features">
                {% for feature in sub_features %}
                <div class="feature-item">
                    <i class="{{ feature.icon }}"></i>
                    <h5>{{ feature.title }}</h5>
                    <p>{{ feature.desc }}</p>
                </div>
                {% endfor %}
            </div>

            <a href="{{ cta_link }}" class="cta-btn">Initialize {{ action_label }} →</a>
        </div>
    </main>

    <footer>
        <div class="container" style="text-align: center; padding: 5rem 0; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 5rem;">
            <div class="logo" style="justify-content: center; display:flex; align-items:center; margin-bottom: 1.5rem;">
                <img src="{{ url_for('static', filename='images/prepwise_logo.png') }}" alt="PrepWise Logo" style="height: 32px; margin-right: 0.8rem; border-radius: 6px;">
                <span style="font-weight: 800; font-size: 1.8rem; letter-spacing: -0.5px; color: var(--text-main);">Prep<span style="color:var(--accent-cyan);">Wise</span></span>
            </div>
            <p style="color: var(--text-muted); font-size: 0.9rem;">&copy; An initiative by Utsav Raj Pratik — built for
                elite achievers.</p>
        </div>
    </footer>
</body>

</html>
